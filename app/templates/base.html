<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#3390ec" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#17212b" media="(prefers-color-scheme: dark)">
    <meta name="description" content="A fast, minimal, and lightweight Telegram web client.">
    <title>{% block title %}Telegram Web Lite{% endblock %}</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='12' fill='%233390ec'/><path fill='white' d='M5.5 11.6l11-4.25c.5-.2.98.12.82.86l-1.87 8.83c-.13.6-.5.75-1 .47l-2.76-2.04-1.33 1.28c-.15.15-.27.27-.55.27l.2-2.8 5.1-4.6c.22-.2-.05-.3-.35-.11l-6.3 3.97-2.72-.85c-.6-.18-.6-.58.14-.86z'/></svg>">
    <link rel="stylesheet" href="/static/css/style.css">

    <script>
        /* Apply the saved/system theme before first paint to avoid a flash. */
        (function () {
            try {
                var saved = localStorage.getItem("twl-theme");
                var theme = saved
                    || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
                document.documentElement.setAttribute("data-theme", theme);
            } catch (e) { /* private mode — keep the default */ }
        })();
    </script>
</head>
<body>
    <!-- Shared icon sprite (inline: works offline & inside sandboxed previews) -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
        <symbol id="i-plane" viewBox="0 0 24 24">
            <path fill="currentColor" d="M21.7 2.3a1 1 0 0 0-1.05-.2L2.6 9.2a1 1 0 0 0 .06 1.87l4.3 1.42 1.6 5.1a1 1 0 0 0 1.7.4l2.3-2.4 4.3 3.16a1 1 0 0 0 1.57-.57l3.5-14.8a1 1 0 0 0-.23-1.08zM9.3 13.1l-.02.03-.9 3-1.05-3.35 9.1-5.7z"/>
        </symbol>
        <symbol id="i-send" viewBox="0 0 24 24">
            <path fill="currentColor" d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a1 1 0 0 0-1.39 1l1.49 5.64L14 12l-10.5 1.76-1.49 5.63a1 1 0 0 0 1.39 1.01z"/>
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M12 5v14M5 12h14"/>
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"/>
        </symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 1 0-.6 4M20 5v6h-6"/>
        </symbol>
        <symbol id="i-trash" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M9.5 7V5.2A1.2 1.2 0 0 1 10.7 4h2.6a1.2 1.2 0 0 1 1.2 1.2V7M6.5 7l.8 11.4A1.6 1.6 0 0 0 8.9 20h6.2a1.6 1.6 0 0 0 1.6-1.6L17.5 7M10.5 11v5M13.5 11v5"/>
        </symbol>
        <symbol id="i-clip" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20.4 11.4l-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l8.6-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"/>
        </symbol>
        <symbol id="i-doc" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5"/>
        </symbol>
        <symbol id="i-download" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14"/>
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/>
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M4 12.5l5 5L20 6.5"/>
        </symbol>
        <symbol id="i-check-double" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" d="M1.5 12.5l4.5 4.5L15 8M9.5 15.2L11 17l9-9"/>
        </symbol>
        <symbol id="i-alert" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 8v5m0 3.2v.1M10.3 3.9L2.5 17.4A2 2 0 0 0 4.2 20.4h15.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
        </symbol>
        <symbol id="i-info" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 11v5M12 7.8v.1"/>
        </symbol>
        <symbol id="i-sun" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1.8v2.4M12 19.8v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M1.8 12h2.4M19.8 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/>
        </symbol>
        <symbol id="i-moon" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20.5 14.3A8.5 8.5 0 1 1 9.7 3.5a6.8 6.8 0 0 0 10.8 10.8z"/>
        </symbol>
        <symbol id="i-eye" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/>
            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
        </symbol>
        <symbol id="i-eye-off" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9.9 5.7A9.9 9.9 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3 3.9M6.5 8.1A17 17 0 0 0 2.5 12S6 18.5 12 18.5c1.4 0 2.6-.3 3.7-.8M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
        </symbol>
        <symbol id="i-chat" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.6 9.6 0 0 1-3.4-.6L3 21l1.8-4.8A8.3 8.3 0 0 1 3.6 11.5a8.4 8.4 0 0 1 9-8.4 8.4 8.4 0 0 1 8.4 8.4z"/>
        </symbol>
        <symbol id="i-logout" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 17l5-5-5-5M20 12H9M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5"/>
        </symbol>
        <symbol id="i-menu" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/>
        </symbol>
        <symbol id="i-back" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </symbol>
        <symbol id="i-chevron-down" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/>
        </symbol>
        <symbol id="i-phone" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15.5 3H8.5A1.5 1.5 0 0 0 7 4.5v15A1.5 1.5 0 0 0 8.5 21h7a1.5 1.5 0 0 0 1.5-1.5v-15A1.5 1.5 0 0 0 15.5 3zM11 18.2h2"/>
        </symbol>
        <symbol id="i-shield" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 21s7-3.2 7-9V5.8L12 3 5 5.8V12c0 5.8 7 9 7 9z"/>
        </symbol>
        <symbol id="i-key" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14.5 3a6.5 6.5 0 0 0-6.2 8.5L3 16.8V21h4.2l1.4-1.4v-2h2v-2h2l1.1-1.1A6.5 6.5 0 1 0 14.5 3zm2.2 4.3v.1"/>
        </symbol>
        <symbol id="i-user" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/>
        </symbol>
        <symbol id="i-lock" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M17.5 10.5h-11A1.5 1.5 0 0 0 5 12v7.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V12a1.5 1.5 0 0 0-1.5-1.5zM8 10.5V7a4 4 0 1 1 8 0v3.5"/>
        </symbol>
    </svg>

    {% block content %}{% endblock %}

    <!-- Toast host -->
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <script src="/static/js/app.js"></script>
</body>
</html>
